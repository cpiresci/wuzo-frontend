<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wuzo Singularity | Painel de Controle</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #080808;
            --panel-bg: #121212;
            --gold-matte: #D4AF37;
            --gold-dim: #A68636;
            --gold-glow: #F5E0A0;
            --text-gray: #A0A0A0;
            --cyan-accent: #00FFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-gray);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .dashboard-container {
            width: 90%;
            max-width: 1400px;
            display: grid;
            grid-template-rows: 80px 1fr 200px;
            gap: 20px;
            height: 90vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .logo {
            color: var(--gold-matte);
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-badge {
            color: var(--cyan-accent);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background: var(--cyan-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--cyan-accent);
            animation: pulse-animation 2s infinite;
        }

        .main-engine {
            background-color: var(--panel-bg);
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            display: grid;
            grid-template-columns: 3fr 1fr;
            padding: 20px;
            gap: 20px;
        }

        .execution-feed {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            overflow-y: scroll;
            color: var(--gold-dim);
        }

        .control-panel {
            border-left: 1px solid #1a1a1a;
            padding-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .action-button {
            background: transparent;
            border: 1px solid var(--gold-matte);
            color: var(--gold-matte);
            padding: 15px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-button:hover {
            background: var(--gold-matte);
            color: #000;
            box-shadow: 0 0 20px var(--gold-dim);
        }

        .asset-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .asset-card {
            background-color: var(--panel-bg);
            border: 1px solid #1a1a1a;
            padding: 15px;
            border-radius: 4px;
        }

        .asset-title {
            color: var(--gold-matte);
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        @keyframes pulse-animation {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <div class="logo">WUZO</div>
            <div class="status-badge">
                <div class="pulse"></div>
                SINGULARITY CORE ONLINE
            </div>
        </header>

        <section class="main-engine">
            <div class="execution-feed" id="log-feed">
                > Sistema inicializado. Aguardando comando...<br>
            </div>
            <div class="control-panel">
                <button class="action-button" onclick="iniciarMissao()">Iniciar Missão</button>
            </div>
        </section>

        <section class="asset-list">
            <div class="asset-card">
                <div class="asset-title">Net Worth Global</div>
                $R\$ 18.520.770,80
            </div>
            <div class="asset-card">
                <div class="asset-title">Imóveis Tokenizados</div>
                RWA-IMOB-14502
            </div>
            <div class="asset-card">
                <div class="asset-title">Portfólio HFT</div>
                452.12 SOL
            </div>
        </section>
    </div>

    <script>
        const CORE_URL = "SUA_URL_DO_WUZO_CORE_NO_RENDER.com"; // <-- TROQUE PELA URL DO RENDER
        const ADMIN_KEY = "wuzo_mestre_2026"; // <-- A CHAVE MESTRE DOapp.py

        async function obterToken() {
            try {
                const response = await fetch(${CORE_URL}/api/core/gerar_token?admin_key=${ADMIN_KEY}, {
                    method: 'POST'
                });
                const data = await response.json();
                return data.access_token;
            } catch (error) {
                console.error("Erro na autenticação:", error);
                logFeed("🛑 ERRO DE AUTENTICAÇÃO: Verifique a Admin Key.");
            }
        }

        async function iniciarMissao() {
            logFeed("🚀 Iniciando Missão Autônoma...");
            const token = await obterToken();
            
            if (!token) return;

            const dadosOperacao = {
                ativo_id: "LEBLON-AP-001",
                tipo_ativo: "imovel",
                valor_brl: 2500000.00,
                contrato_uri: "ipfs://...",
                matricula_uri: "ipfs://...",
                solicitante_id: "cleiton_admin"
            };

            try {
                const response = await fetch(${CORE_URL}/api/core/iniciar_operacao, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': Bearer ${token}
                    },
                    body: JSON.stringify(dadosOperacao)
                });

                const resultado = await response.json();
                
                if (response.status === 200) {
                    logFeed(✅ SUCESSO! TX Solana: ${resultado.detalhes.tx_solana});
                } else if (response.status === 403) {
                    logFeed(❌ VETO JURÍDICO: ${resultado.detail});
                } else {
                    logFeed(🛑 FALHA CRÍTICA: ${resultado.detail});
                }
                
            } catch (error) {
                console.error("Erro na operação:", error);
                logFeed("🛑 ERRO DE CONEXÃO: Verifique se o Core está online.");
            }
        }

        function logFeed(message) {
            const feed = document.getElementById('log-feed');
            feed.innerHTML += > ${message}<br>;
            feed.scrollTop = feed.scrollHeight;
        }
    </script>
</body>
</html>
